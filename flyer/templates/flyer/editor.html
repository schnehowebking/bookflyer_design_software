{% extends 'flyer/base.html' %}
{% block content %}
    <h2>Flyer Editor</h2>
    <div class="row">
    <div class="col-md-8">
    <!-- Canvas area -->
    <div>
    <canvas id="flyerCanvas" width="800" height="1200" style="border:1px solid #ccc"></canvas>
    </div>
    <div class="mt-2">
    <button id="exportPng" class="btn btn-success">Export PNG</button>
    <button id="exportPdf" class="btn btn-secondary">Export PDF</button>
    <button id="saveProject" class="btn btn-primary">Save Project</button>
    </div>
    </div>
    <div class="col-md-4">
    <h5>Tools</h5>
    <div class="form-group">
    <label>Upload Cover Image</label>
    <input type="file" id="coverUpload" accept="image/*" class="form-control-file">
    </div>
    <div class="form-group">
    <label>Title</label>
    <input id="titleText" class="form-control" placeholder="Book Title">
    </div>
    <div class="form-group">
    <label>Author</label>
    <input id="authorText" class="form-control" placeholder="Author Name">
    </div>
    <div class="form-group">
    <label>Price</label>
    <input id="priceText" class="form-control" placeholder="$9.99">
    </div>
    </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.2.4/fabric.min.js"></script>
    <script src="{% static 'flyer/js/editor.js' %}"></script>
{% endblock %}
